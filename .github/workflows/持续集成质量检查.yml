name: public-learning-quality

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interview-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/interview-bank/pyproject.toml
      - name: Install offline bank checks
        run: python -m pip install -e 'apps/interview-bank[dev]'
      - name: Verify generated offline assets
        run: |
          python apps/interview-bank/scripts/build_personal_latest.py --check
          python apps/interview-bank/scripts/build_bank.py --check
          python apps/interview-bank/scripts/audit_question_quality.py --check
          python apps/interview-bank/scripts/build_offline.py --check
      - name: Run offline data and quality tests
        run: pytest -q apps/interview-bank/tests

  automation-framework-offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/automation-practice
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/automation-practice/pyproject.toml
      - name: Install framework dependencies
        run: python -m pip install -e '.[all,dev]'
      - name: Check formatting and static rules
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Run offline tests and verify external guards
        run: pytest -q

  app-automation-learning:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/app-automation-learning
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/app-automation-learning/pyproject.toml
      - name: Install App learning dependencies
        run: python -m pip install -e '.[all]'
      - name: Check formatting and static rules
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Run deterministic App learning tests
        run: pytest -q -m "not device"

  api-and-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/demo-shop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/demo-shop/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Start synthetic demo service
        run: |
          uvicorn app.商城服务:app --host 127.0.0.1 --port 8000 > /tmp/demo-shop.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat /tmp/demo-shop.log
          exit 1
      - name: Run API and deterministic AI checks
        run: pytest tests/api tests/ai -q

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/demo-shop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/demo-shop/pyproject.toml
      - name: Install UI dependencies
        run: |
          python -m pip install -e '.[test,ui]'
          python -m playwright install --with-deps chromium
      - name: Start synthetic demo service
        run: |
          uvicorn app.商城服务:app --host 127.0.0.1 --port 8000 > /tmp/demo-shop.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat /tmp/demo-shop.log
          exit 1
      - name: Run browser journey
        run: pytest tests/ui -q --tracing=retain-on-failure --screenshot=only-on-failure
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: labs/demo-shop/test-results/
          if-no-files-found: ignore
          retention-days: 7
