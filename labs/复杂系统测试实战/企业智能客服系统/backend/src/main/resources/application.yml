server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-customer-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:customer_service;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

application:
  demo-data-enabled: ${DEMO_DATA_ENABLED:true}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    suggestion-path: ${AI_SUGGESTION_PATH:/api/v1/customer-service/suggest}
    connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_READ_TIMEOUT:20s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

resilience4j:
  circuitbreaker:
    instances:
      aiMiddleware:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2

springdoc:
  swagger-ui:
    path: /swagger-ui.html
