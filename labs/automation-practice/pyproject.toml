[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-automation-practice"
version = "0.1.0"
description = "Public, reproducible API, Web and mobile automation learning project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pytest>=8.3,<10",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
api = [
  "jsonschema>=4.23,<5",
  "requests>=2.32,<3",
]
web = [
  "pytest-playwright>=0.7,<1",
]
mobile = [
  "Appium-Python-Client>=5,<6",
]
all = [
  "Appium-Python-Client>=5,<6",
  "jsonschema>=4.23,<5",
  "pytest-playwright>=0.7,<1",
  "requests>=2.32,<3",
]
dev = [
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "测试_*.py"]
markers = [
  "api: API automation tests",
  "web: browser UI automation tests",
  "mobile: native mobile automation tests",
  "mock: deterministic offline tests that never control a real device",
  "contract: reusable behavior contracts shared by fake and real adapters",
  "device: tests that create a real Appium session and require --run-mobile",
  "android: tests that require an Android device",
  "ios: tests that require an iOS device or simulator",
  "external: low-frequency tests against a public learning service",
  "smoke: short critical-path checks",
  "e2e: end-to-end business journeys",
  "challenge: exercises intended for deliberate practice",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
